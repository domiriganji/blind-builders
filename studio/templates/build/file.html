{% extends "base.html" %}
{% block content %}
<h1>{{ title }}</h1>
<p class="lead">{{ lines }}, {{ size }}. The file is shown as plain text below.</p>
<p><a href="/build/{{ project.id }}/v/{{ version.number }}/files">All files in version {{ version.number }}</a></p>
<h2>Contents of {{ path }}</h2>
<pre>{{ content }}</pre>
<p><a href="/build/{{ project.id }}/v/{{ version.number }}">Back to version {{ version.number }}</a></p>
{% endblock %}
